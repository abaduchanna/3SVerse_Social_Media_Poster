name: Build Social Media Poster

# Seller-only tool - builds 3SVerse Social Media Poster as a SINGLE .exe
# (Nuitka --onefile) and attaches the exe itself to a release in this
# PRIVATE repo. No zip folder — the release asset IS the runnable exe.
# NOTE: a onefile exe self-extracts into a cache dir at runtime, which
# some antivirus static AI can flag; users may see a SmartScreen prompt
# (More info → Run anyway) on first launch. Documented in README.
# Developed by www.3SVerse.com (c) 2026

on:
  push:
    branches: [main]
    paths: ["social_media_poster.py", "linkedin_poster.py", "linkedin_bridge.py", "meta_workflow.py", "youtube_workflow.py", "fbg_workflow.py", "web_workflow.py", "branding_runtime.py", "spiral.webp", "orb.webp", "brand_bg_*.png", "brand_linkedin.png", "brand_meta.png", "brand_youtube.png", "brand_facebook.png", "3sverse_icon.ico", "chrome-extension/**", ".github/workflows/build-poster.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Single source of truth: VERSION in social_media_poster.py drives the
      # exe metadata AND the release tag.
      - name: Read version from social_media_poster.py
        shell: pwsh
        run: |
          $v = (Select-String -Path social_media_poster.py -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          echo "VERSION=$v" >> $env:GITHUB_ENV
          echo "building Social Media Poster $v"

      - name: Install build deps
        run: python -m pip install nuitka selenium pillow

      # Bake the brand art (4 official platform marks, header wordmark,
      # window icon) into the build as base64. EMBEDDED-FIRST keeps the
      # tab marks and the header logo working in ONEFILE mode regardless
      # of where __file__ or the payload extraction dir resolve — the
      # v2.x exe silently fell back to text-only tabs when the PIL/disk
      # lookup missed. Disk copies stay as a fallback in the payload.
      - name: Embed brand assets
        shell: bash
        run: |
          python -c "import base64; enc=lambda p: base64.b64encode(open(p,'rb').read()).decode('ascii'); open('embedded_brand_assets.py','w').write('EMBEDDED_LINKEDIN_B64 = \"%s\"\nEMBEDDED_META_B64 = \"%s\"\nEMBEDDED_YOUTUBE_B64 = \"%s\"\nEMBEDDED_FACEBOOK_B64 = \"%s\"\nEMBEDDED_LOGO_B64 = \"%s\"\nEMBEDDED_ICO_B64 = \"%s\"\nEMBEDDED_SPIRAL_B64 = \"%s\"\nEMBEDDED_ORB_B64 = \"%s\"\n' % (enc('brand_linkedin.png'), enc('brand_meta.png'), enc('brand_youtube.png'), enc('brand_facebook.png'), enc('3sverse_logo_header.png'), enc('3sverse_icon.ico'), enc('spiral.webp'), enc('orb.webp')))"
          python -c "import embedded_brand_assets as e; assert all(getattr(e,k) for k in ('EMBEDDED_LINKEDIN_B64','EMBEDDED_META_B64','EMBEDDED_YOUTUBE_B64','EMBEDDED_FACEBOOK_B64','EMBEDDED_LOGO_B64','EMBEDDED_ICO_B64','EMBEDDED_SPIRAL_B64','EMBEDDED_ORB_B64')); print('brand assets embedded OK (4 platform marks + wordmark + ico + spiral + orb)')"

      - name: Build with Nuitka (onefile - single portable exe)
        shell: cmd
        run: >
          python -m nuitka --onefile --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --windows-console-mode=disable
          --windows-icon-from-ico=3sverse_icon.ico
          --company-name="3S Verse"
          --product-name="3SVerse Social Media Poster"
          --file-version="${{ env.VERSION }}.0" --product-version="${{ env.VERSION }}.0"
          --file-description="3SVerse Social Media Poster (LinkedIn / Meta / YouTube / FB Groups campaign scheduler)"
          --onefile-tempdir-spec="%CACHE_DIR%/{PRODUCT}/{VERSION}"
          --python-flag=no_asserts,no_docstrings
          --include-package=selenium
          --include-module=embedded_brand_assets
          --include-module=PIL.Image
          --include-module=PIL.ImageTk
          --include-module=PIL.WebPImagePlugin
          --include-data-file=3sverse_icon.ico=3sverse_icon.ico
          --include-data-file=3sverse_logo_header.png=3sverse_logo_header.png
          --include-data-file=spiral.webp=spiral.webp
          --include-data-file=orb.webp=orb.webp
          --include-data-file=bg_ring.png=bg_ring.png
          --include-data-file=bg_orb.png=bg_orb.png
          --include-data-file=brand_bg_ring.png=brand_bg_ring.png
          --include-data-file=brand_bg_orb.png=brand_bg_orb.png
          --include-data-file=brand_linkedin.png=brand_linkedin.png
          --include-data-file=brand_meta.png=brand_meta.png
          --include-data-file=brand_youtube.png=brand_youtube.png
          --include-data-file=brand_facebook.png=brand_facebook.png
          --include-data-dir=chrome-extension=chrome-extension
          --output-dir=dist social_media_poster.py

      - name: Rename exe
        shell: pwsh
        run: |
          Move-Item dist\social_media_poster.exe dist\3SVerse_Social_Media_Poster.exe -Force
          (Get-Item dist\3SVerse_Social_Media_Poster.exe).Length

      # NOTE: no actions/upload-artifact here - artifact storage quota
      # would block the build. Release assets do NOT count against it.

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: social-poster-v${{ env.VERSION }}
          name: 3SVerse Social Media Poster ${{ env.VERSION }}
          files: |
            dist/3SVerse_Social_Media_Poster.exe
